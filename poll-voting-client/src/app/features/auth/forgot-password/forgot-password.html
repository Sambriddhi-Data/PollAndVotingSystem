<div class="auth-container">
  <h2>Forgot Password</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>Email</label>
    <input type="email" formControlName="email" />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
    @if (message()) {
      <p class="success">{{ message() }}</p>
    }
    @if (devOtp()) {
      <p class="success">Dev mode OTP: <strong>{{ devOtp() }}</strong></p>
    }

    <button type="submit" [disabled]="form.invalid">Send Reset Code</button>
  </form>

  @if (message()) {
    <button class="btn-outline" (click)="goToReset()">Enter Reset Code</button>
  }

  <p><a routerLink="/login">Back to login</a></p>
</div>
